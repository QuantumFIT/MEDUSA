name: claude-review

# Automated code review of pull requests by Claude Code, run against the
# CERIT-SC LLM service (Anthropic-compatible API) instead of api.anthropic.com:
# https://docs.cerit.io/en/docs/ai-as-a-service/llm-integration
#
# How it runs, and why this shape:
#   - The workflow, not the model, fetches the PR (diff and description) and
#     posts the result. The model only reads: Claude Code gets the Read, Grep
#     and Glob tools and nothing else (--tools), each limited to the checkout
#     (Read(./**) etc.), every other request is denied (--permission-mode
#     dontAsk), and no GitHub token is in its environment.
#   - Its answer is posted publicly, and its environment necessarily holds the
#     CERIT key, so it must not be able to read anything outside the checkout:
#     the PR inputs are placed inside it, symlinks are removed from it (a PR
#     could add one pointing at /proc/self/environ), the path rules deny
#     everything else - verified locally against a decoy file - and the
#     answer is scanned for the key and common token formats before posting.
#     A first version used claude-code-action, whose "auto" permission mode let
#     the model run arbitrary shell commands; with CERIT's models it wandered
#     off to inspect its own CI run and timed out without a review.
#   - CERIT's models are not Claude ("agentic" is a Qwen model), so turns and
#     thinking are capped and the prompt is explicit about the output format.
#   - One comment per PR, updated in place on every push.
#
# The key is the repository secret CERIT_API_KEY (generated in the AI Chat
# WebUI at https://chat.ai.e-infra.cz). The model is CERIT's "agentic" alias
# unless the repository variable CERIT_REVIEW_MODEL names another (CERIT lists
# agentic, thinker, mini, coder and qwen3-coder-next).
#
# Known limitation: the PR title, body and diff are model input, so a PR can
# try to steer the review ("report no issues"). The model cannot act on
# anything - it only reads and its answer is posted as text - so the worst
# case is a misleading advisory comment.
#
# The review is advisory: it comments and never approves or blocks. It runs
# only for PRs from branches of this repository (forks get no secrets) and
# skips drafts; a new push cancels a review still in progress.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skipped when every changed file is documentation or benchmark data.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'benchmarks/**'
      - 'AUTHORS'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Code review (CERIT)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANTHROPIC_BASE_URL: https://llm.ai.e-infra.cz
      REVIEW_MODEL: ${{ vars.CERIT_REVIEW_MODEL || 'agentic' }}
      PR: ${{ github.event.pull_request.number }}
      # Inside the checkout, so the model's path-scoped tools can read it.
      REVIEW_DIR: ${{ github.workspace }}/claude-review-input

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Fail early, with a readable message, when the secret is missing or the
      # endpoint cannot serve requests: a one-token /v1/messages call, streamed
      # as Claude Code sends it. Prints only status, timing and the reply to
      # "Reply with OK" - this repository is public.
      - name: Check CERIT endpoint and key
        env:
          CERIT_API_KEY: ${{ secrets.CERIT_API_KEY }}
        run: |
          if [ -z "${CERIT_API_KEY}" ]; then
            echo "::error::Repository secret CERIT_API_KEY is not set."
            exit 1
          fi
          body=$(printf '{"model":"%s","max_tokens":16,"stream":true,"messages":[{"role":"user","content":"Reply with OK"}]}' "${REVIEW_MODEL}")
          out=$(curl -sS --max-time 120 -o resp.txt -w '%{http_code} %{time_starttransfer}' \
                  -H 'content-type: application/json' -H 'anthropic-version: 2023-06-01' \
                  -H "Authorization: Bearer ${CERIT_API_KEY}" -H "x-api-key: ${CERIT_API_KEY}" \
                  -d "${body}" "${ANTHROPIC_BASE_URL%/}/v1/messages") || out="000 -"
          read -r code ttfb <<<"${out}"
          echo "model ${REVIEW_MODEL}: HTTP ${code}, first byte ${ttfb}s"
          if [ -s resp.txt ]; then grep -o '"model": *"[^"]*"' resp.txt | head -1 || true; fi
          # A streamed reply can be HTTP 200 and still carry an error event.
          if grep -q '"type": *"error"' resp.txt 2>/dev/null; then
            echo "::warning::CERIT answered with an error event for model ${REVIEW_MODEL}; the review may fail."
          fi
          rm -f resp.txt
          # Fatal only for what will certainly break the review (the key, the
          # connection); anything else is reported and the review is tried.
          case "${code}" in
            200) ;;
            401|403) echo "::error::CERIT rejected the key (HTTP ${code})."; exit 1 ;;
            000) echo "::error::No response from ${ANTHROPIC_BASE_URL}."; exit 1 ;;
            *) echo "::warning::CERIT returned HTTP ${code} for model ${REVIEW_MODEL}; trying the review anyway." ;;
          esac

      # The PR as the model sees it. Large diffs are cut at file boundaries,
      # source and test files first, and the dropped files are listed, so the
      # budget is not spent on workflows or data before src/ is reached.
      - name: Collect the pull request
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # No symlinks in the tree the model can read: a PR could add one
          # pointing outside the checkout.
          find . -type l -not -path './.git/*' -print -delete
          d="${REVIEW_DIR}"; mkdir -p "${d}"
          # The file list comes from the diff: `gh pr view --json files` stops
          # at 300 files.
          {
            gh pr view "${PR}" --json title,body --template '{{.title}}{{"\n\n"}}{{.body}}{{"\n"}}'
            echo; echo "Changed files:"
            gh pr diff "${PR}" --name-only
          } > "${d}/pr.md"
          gh pr diff "${PR}" > "${d}/full.diff"
          python3 - "${d}" <<'PY'
          import pathlib, re, sys
          d = pathlib.Path(sys.argv[1])
          full = d.joinpath("full.diff").read_text(errors="replace")
          parts = re.split(r"(?m)^(?=diff --git )", full)
          files = [p for p in parts if p.startswith("diff --git ")]
          name = lambda p: p.split("\n", 1)[0].split(" b/", 1)[-1]
          rank = lambda p: 0 if name(p).startswith(("src/", "tests/")) else 1
          limit, kept, dropped, used = 120_000, [], [], 0
          for p in sorted(files, key=rank):
              if used + len(p) <= limit or not kept:
                  kept.append(p); used += len(p)
              else:
                  dropped.append(name(p))
          out = "".join(kept)
          if dropped:
              out += "\n[diff cut at file boundaries; not shown: " + ", ".join(dropped) + "]\n"
              d.joinpath("truncated").write_text(f"{len(kept)} {len(files)} " + " ".join(dropped) + "\n")
          d.joinpath("pr.diff").write_text(out)
          print(f"diff: {len(full)} bytes, {len(files)} files, {len(dropped)} not shown")
          d.joinpath("nfiles").write_text(str(len(files)))
          PY
          if [ "$(cat "${d}/nfiles")" = "0" ]; then
            echo "empty=true" >> "${GITHUB_OUTPUT}"
            echo "Empty diff; nothing to review."
          fi

      # Pinned, from npm: a fixed CLI version rather than a remote install
      # script piped into a shell.
      - name: Install Claude Code
        if: steps.collect.outputs.empty != 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.286

      - name: Review
        if: steps.collect.outputs.empty != 'true'
        timeout-minutes: 20
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.CERIT_API_KEY }}
          # Every model slot (main, subagents, background calls) uses the
          # configured model, so CERIT_REVIEW_MODEL really switches the run.
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.CERIT_REVIEW_MODEL || 'agentic' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.CERIT_REVIEW_MODEL || 'agentic' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.CERIT_REVIEW_MODEL || 'agentic' }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          API_TIMEOUT_MS: "300000"
          MAX_THINKING_TOKENS: "8000"
        run: |
          d="${REVIEW_DIR}"
          # Quoted heredoc: nothing in the prompt is expanded by the shell.
          # @PR@ is filled in by sed below.
          cat > "${d}/prompt.md" <<'EOF'
          You are reviewing pull request #@PR@ of MEDUSA, a quantum circuit
          simulator in C (with an optional C++ gate path) built on
          multi-terminal BDDs from the MoToBuddy library. MoToBuddy itself is
          not in this checkout; the MEDUSA sources are under src/ and tests/.

          The pull request description is in claude-review-input/pr.md and its
          diff in claude-review-input/pr.diff (relative to the current
          directory, which is the repository checkout). Read both first. If the diff ends with a note that
          some files are not shown, say which in your answer. Then read surrounding source files
          with Read, Grep and Glob only where the diff alone is not enough.
          Review the changed code only. Do not investigate the CI environment,
          the workflow running you, or anything outside the repository.

          Look for, in this order:
          1. Correctness bugs: wrong results, crashes, undefined behaviour,
             integer overflow, off-by-one, NaN or zero handling in leaf
             arithmetic.
          2. Reference counting and GC safety: every qBDD that must survive a
             later apply is qBDD_protect-ed and qBDD_unprotect-ed exactly once,
             nothing is used after its last unprotect, leaf values (LEAF_TYPE,
             pImpl) are freed exactly once.
          3. Memory leaks and missing error handling on new allocation or I/O.
          4. Performance regressions on hot paths (apply callbacks, leaf ops,
             per-gate code) and changes to numerical behaviour (snapping,
             epsilons) that alter results.
          5. Missing tests for changed behaviour; changes that break the
             Makefile or CMake builds or the CI workflows.

          Report only issues you can point at in the diff, each with a concrete
          failure scenario. No style remarks, no praise, no summary of what the
          PR does. Say so when you are unsure.

          Your final answer is posted verbatim as a GitHub comment. Format it
          as Markdown: a list of findings, most severe first, each as
          "**file:line** - the problem, then the scenario where it goes wrong";
          or, if you found nothing, the single line "No issues found."
          EOF
          sed -i -e "s|@PR@|${PR}|g" "${d}/prompt.md"
          set +e
          # Own time limit below the step's, so a hung run is still parsed and
          # reported (and its partial answer kept) rather than killed.
          timeout 17m claude -p "$(cat "${d}/prompt.md")" \
            --model "${REVIEW_MODEL}" \
            --tools "Read,Grep,Glob" \
            --allowedTools "Read(./**)" "Grep(./**)" "Glob(./**)" \
            --permission-mode dontAsk --strict-mcp-config \
            --max-turns 40 \
            --output-format json < /dev/null > "${d}/result.json" 2> "${d}/stderr.txt"
          rc=$?
          set -e
          echo "claude exit: ${rc}"
          echo "${rc}" > "${d}/rc"
          python3 - "${d}" <<'PY'
          import json, sys, pathlib
          d = pathlib.Path(sys.argv[1])
          try:
              r = json.loads((d / "result.json").read_text())
          except Exception as e:
              rc = (d / "rc").read_text().strip() if (d / "rc").exists() else "?"
              why = "timed out after 17 minutes" if rc == "124" else f"no result (exit {rc})"
              r = {"is_error": True, "subtype": why, "result": ""}
          print({k: r.get(k) for k in ("subtype", "is_error", "num_turns", "duration_ms", "duration_api_ms")})
          text = (r.get("result") or "").strip()
          sub = str(r.get("subtype") or "error")
          if text and not r.get("is_error"):
              status = "ok"
          elif text and sub.startswith("error_max"):
              status = "partial"          # cut short by a cap: still worth posting
          elif sub.startswith("error_max"):
              status = "failed"
              sub += " (the model used up its turns without writing a review)"
          else:
              status = "failed"
              err = (d / "stderr.txt").read_text(errors="replace").strip().splitlines()
              err = [l for l in err if l.strip() and "unrecognized_model" not in l]
              sub += f": {err[0][:200]}" if err else ""
          # Both the answer and the failure detail (partly the endpoint's own
          # error text) are posted publicly: refuse anything that contains the
          # key or looks like a credential, and keep the detail plain text.
          import os, re
          key = os.environ.get("ANTHROPIC_AUTH_TOKEN", "")
          cred = re.compile(r"\b(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})")
          leaks = lambda t: bool(t) and ((key and key in t) or bool(cred.search(t)))
          if leaks(text):
              text, status, sub = "", "failed", "withheld: the answer contained something that looks like a credential"
          if leaks(sub):
              sub = "error (details withheld: they looked like a credential; see the run log)"
          sub = re.sub(r"[`*_\[\]<>|#]", "", sub)[:200]
          (d / "review.md").write_text(text if status != "failed" else "")
          (d / "status").write_text(status)
          (d / "detail").write_text(sub)
          PY
          echo "--- stderr (first 20 lines) ---"; head -20 "${d}/stderr.txt" || true

      # One comment per PR, found by a hidden marker and edited on later runs.
      # A failed run leaves an earlier review in place (it only warns), so a
      # flaky endpoint cannot erase a review someone already read. Advisory:
      # this step never fails the job.
      - name: Post the review
        if: always() && steps.collect.outputs.empty != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          d="${REVIEW_DIR}"; mkdir -p "${d}"
          status=$(cat "${d}/status" 2>/dev/null || echo "failed")
          detail=$(cat "${d}/detail" 2>/dev/null || echo "an earlier step failed")
          if ! id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                      --jq '.[] | select(.body | startswith("<!-- claude-review -->")) | .id' | tail -1); then
            # Without knowing the existing comment, posting would duplicate it.
            echo "::warning::Could not list PR comments; not posting (${status}: ${detail})."
            exit 0
          fi
          if [ "${status}" = "failed" ] && [ -n "${id}" ]; then
            # Keep the earlier review, but mark it as not covering this commit.
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" --jq .body > "${d}/old.md"
            python3 - "${d}" "${SHA:0:7}" "${detail}" "${RUN_URL}" <<'PY'
          import pathlib, re, sys
          d, sha, detail, run = pathlib.Path(sys.argv[1]), *sys.argv[2:]
          body = d.joinpath("old.md").read_text()
          body = re.sub(r"(?m)^> \*\*Stale:\*\*.*\n\n", "", body)
          note = (f"> **Stale:** the review of {sha} did not complete ({detail}); "
                  f"the findings below are for the commit named in the heading. [Run]({run})\n\n")
          head, sep, rest = body.partition("\n")            # marker line
          heading, sep2, rest = rest.partition("\n")        # "### ..." line
          d.joinpath("comment.md").write_text(f"{head}\n{heading}\n\n{note}{rest.lstrip(chr(10))}")
          PY
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@"${d}/comment.md" > /dev/null
            echo "::warning::Review did not complete (${detail}); marked the earlier review as stale."
            exit 0
          fi
          {
            echo "<!-- claude-review -->"
            echo "### Claude Code review (CERIT, model \`${REVIEW_MODEL}\`) of ${SHA:0:7}"
            echo
            if [ -f "${d}/truncated" ]; then
              read -r shown total dropped < "${d}/truncated" || true
              echo "> The diff was too large: ${shown} of ${total} files were reviewed. Not examined: ${dropped}"
              echo
            fi
            case "${status}" in
              ok) cat "${d}/review.md" ;;
              partial)
                echo "> The review was cut short (${detail}); findings so far:"
                echo
                cat "${d}/review.md" ;;
              *) echo "_The review did not complete (${detail}); see [the run](${RUN_URL})._" ;;
            esac
            echo
            echo "<sub>Automated and advisory: it may be wrong, and it does not block merging. [Run](${RUN_URL}).</sub>"
          } > "${d}/comment.md"
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@"${d}/comment.md" > /dev/null
            echo "updated comment ${id}"
          else
            gh pr comment "${PR}" --body-file "${d}/comment.md"
          fi
          if [ "${status}" != "ok" ]; then echo "::warning::Review ${status}: ${detail}"; fi
