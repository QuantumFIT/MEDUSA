name: coverage

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: gcov -> Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # gcovr comes from apt rather than pip: the runner's Python is
      # externally managed (PEP 668), so `pip install gcovr` is unreliable.
      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3 gcovr

      - name: Build MoToBuddy
        run: make init

      # COVERAGE=1 switches CFLAGS to "-O0 -g --coverage". CFLAGS is used for
      # both compiling and linking, so this instruments the objects and pulls
      # in libgcov in one go.
      - name: Run test suite with coverage instrumentation
        run: make test COVERAGE=1

      # Also measured, because this is what exercises the symbolic gate path:
      # including it lifts src/gates_symb.c from ~16% to ~45%. gcovr merges the
      # .gcda files from all the per-leaf-type object directories.
      - name: Run Grover matrix with coverage instrumentation
        run: make test-grover COVERAGE=1

      - name: Build Sylvan and Lace
        run: make init-sylvan

      # Measured too, so src/interface_implementations/backends/interface_sylvan.c
      # is not a blind spot. Sylvan's own sources live under lib/ and are
      # excluded by codecov.yml, so only MEDUSA's Sylvan backend is counted.
      - name: Run Sylvan suite with coverage instrumentation
        run: make test-sylvan COVERAGE=1

      - name: Generate Cobertura report
        run: make coverage-report

      # Uploading is best-effort: until the repository is activated on Codecov
      # and CODECOV_TOKEN is set, this step reports a failure that should not
      # turn the whole job red. Flip fail_ci_if_error to true once the token is
      # in place and you want a missing upload to be treated as a real error.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: c
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Keeps the numbers reachable even when the Codecov upload is skipped.
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # Coverage for the C++ gate implementations - the #else branches of the
  # __cplusplus splits in gates.c / gates_symb.c, which the C build preprocesses
  # away and therefore never even lists as uncovered.
  #
  # This has to be its own job: USE_CXX=1 writes into the same object directory
  # as the C build, so running both in one workspace would clobber the profiles.
  # The two reports instrument different line sets of the same sources, so they
  # are uploaded under separate flags (c / cxx) and Codecov unions them per line.
  #
  # Sylvan is absent by design - it has no C++ / MOSF path.
  coverage-cxx:
    name: gcov -> Codecov (C++ gates)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3 gcovr

      - name: Build MoToBuddy
        run: make init

      - name: Run test suite with coverage instrumentation (USE_CXX=1)
        run: make test USE_CXX=1 COVERAGE=1

      # LP-Grover's loop body uses bare x and z, which no symbolic fixture
      # does, so this is what reaches gate_symb_x / gate_symb_z in the C++
      # build - the same reason the C flag covers them.
      - name: Run Grover matrix with coverage instrumentation (USE_CXX=1)
        run: make test-grover USE_CXX=1 COVERAGE=1

      - name: Generate Cobertura report
        run: make coverage-report COVERAGE_XML=coverage-cxx.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-cxx.xml
          flags: cxx
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cxx-xml
          path: coverage-cxx.xml
          if-no-files-found: warn
