name: coverage

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One coverage build (the CMake coverage preset: -O0 -g --coverage) with
  # every variant - the C and the C++ gate path, and the optional Sylvan
  # backend - and one CTest run over their per-PR suites.
  #
  # gates.c and gates_symb.c are compiled both as C and as C++, and the
  # __cplusplus splits mean each instruments a different set of lines. The
  # variants have object directories of their own, so the C and the C++ runs
  # are reported separately from the same tree and uploaded under the flags
  # c / cxx; Codecov unions them per line (codecov.yml).
  coverage:
    name: gcov -> Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # gcovr comes from apt rather than pip: the runner's Python is
      # externally managed (PEP 668), so `pip install gcovr` is unreliable.
      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3 gcovr

      - name: Configure
        run: cmake --preset coverage -DMEDUSA_SYLVAN=ON -DMEDUSA_TEST_TIMEOUT_MAX=1500

      - name: Build
        run: cmake --build --preset coverage -j "$(nproc)"

      # pr and cxx are the default product on both gate paths, Grover matrix
      # included (it lifts src/gates_symb.c from ~16% to ~45%); sylvan keeps
      # interface_sylvan.c from being a blind spot (Sylvan's own sources are
      # excluded by codecov.yml). The nightly sweeps stay out.
      - name: Run the suites with coverage instrumentation
        run: >-
          ctest --test-dir build/coverage -L 'pr|cxx|sylvan' -LE nightly
          -j "$(nproc)" --output-on-failure

      # The MEDUSA sources are compiled into one object library per variant
      # (CMakeFiles/medusa_core_<variant>.dir); the _cxx ones are the C++ gate
      # path. Each report reads only its own variants' counters.
      - name: Generate Cobertura reports
        run: |
          cd build/coverage/CMakeFiles
          c_dirs=$(ls -d medusa_core_*.dir | grep -v '_cxx\.dir$')
          cxx_dirs=$(ls -d medusa_core_*_cxx.dir)
          echo "C:   ${c_dirs}"; echo "C++: ${cxx_dirs}"
          cd "${GITHUB_WORKSPACE}"
          gcovr --root . --filter 'src/' --exclude 'tests/' --xml-pretty \
                --output coverage.xml --print-summary \
                $(printf 'build/coverage/CMakeFiles/%s ' ${c_dirs})
          gcovr --root . --filter 'src/' --exclude 'tests/' --xml-pretty \
                --output coverage-cxx.xml --print-summary \
                $(printf 'build/coverage/CMakeFiles/%s ' ${cxx_dirs})

      # Uploading is best-effort: until the repository is activated on Codecov
      # and CODECOV_TOKEN is set, this step reports a failure that should not
      # turn the whole job red. Flip fail_ci_if_error to true once the token is
      # in place and you want a missing upload to be treated as a real error.
      - name: Upload the C report to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: c
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload the C++ report to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-cxx.xml
          flags: cxx
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Keeps the numbers reachable even when the Codecov upload is skipped.
      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage-cxx.xml
          if-no-files-found: warn
