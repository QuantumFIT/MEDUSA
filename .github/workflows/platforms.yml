name: platforms

# Does MEDUSA build and pass on the systems people actually use? The tests
# workflow runs on one image (ubuntu-latest), so it only ever sees one GCC,
# one CMake and one GMP. This runs the same build across the Ubuntu releases
# still in use, each with its own default toolchain and libraries, with clang
# as a second compiler, and on Apple Silicon macOS.
#
# Each job runs .github/scripts/platform-probe.sh: per leaf type (f32, f64,
# f80, f128, gmp) it builds MEDUSA and runs the unit suite, the Grover matrix
# and the circuit smoke test, then writes a pass/FAIL table, headed by the
# compiler, CMake and GMP versions, to the job summary.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'        # weekly, Sunday 03:17 UTC
  pull_request:
    paths:
      - '.github/workflows/platforms.yml'
      - '.github/scripts/platform-probe.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.release }}${{ matrix.cc == 'clang' && ', clang' || '' }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.release }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Default toolchain of each release (GCC / CMake / GMP):
        #   20.04 GCC 9, CMake 3.16, GMP 6.2.0 - oldest, past standard support
        #   22.04 GCC 11, CMake 3.22, GMP 6.2.1
        #   24.04 GCC 13, CMake 3.28, GMP 6.3.0 - what tests.yml runs on
        #   26.04 newest LTS
        release: ['20.04', '22.04', '24.04', '26.04']
        cc: [gcc]
        include:
          - release: '24.04'
            cc: clang
    env:
      DEBIAN_FRONTEND: noninteractive
      PLATFORM: Ubuntu ${{ matrix.release }}, ${{ matrix.cc }}
    steps:
      # flex and bison: MoToBuddy's CMake configuration needs them (its bddcalc
      # example calls FLEX_TARGET). The GitHub runner image happens to have
      # them, which is why tests.yml never noticed; a plain system does not.
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              build-essential cmake git ca-certificates libgmp-dev python3 flex bison \
              ${{ matrix.cc == 'clang' && 'clang' || '' }} > /dev/null

      - uses: actions/checkout@v7

      # clang builds MoToBuddy too (CMake reads CC/CXX) and MEDUSA (the probe
      # passes CC/CXX to make).
      - name: Select the compiler
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "${GITHUB_ENV}"
          echo "CXX=clang++" >> "${GITHUB_ENV}"

      - name: Build MoToBuddy
        run: make init

      - name: Probe
        run: bash .github/scripts/platform-probe.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs-ubuntu-${{ matrix.release }}-${{ matrix.cc }}
          path: probe-logs/
          if-no-files-found: ignore

  macos:
    name: macOS (Apple Silicon, Apple clang)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PLATFORM: macOS 15 arm64, Apple clang, LTO=0
      # Apple clang rejects -ffat-lto-objects, which the release build always
      # passes, so nothing builds with the default flags. LTO=0 gets past that
      # to whatever comes next; the Makefile should only add the flag where it
      # is supported.
      MAKE_EXTRA: LTO=0
    steps:
      - uses: actions/checkout@v7

      # `gcc` is Apple clang here. Homebrew's bash and coreutils because the
      # test scripts assume bash 4+ and GNU tools; Homebrew's prefix is not on
      # the compiler's search path by default.
      - name: Install dependencies
        run: |
          brew install gmp bash coreutils
          p=$(brew --prefix)
          echo "${p}/opt/coreutils/libexec/gnubin" >> "${GITHUB_PATH}"
          echo "CPATH=${p}/include" >> "${GITHUB_ENV}"
          echo "LIBRARY_PATH=${p}/lib" >> "${GITHUB_ENV}"

      - name: Build MoToBuddy
        run: make init

      - name: Probe
        run: bash .github/scripts/platform-probe.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-logs-macos
          path: probe-logs/
          if-no-files-found: ignore
