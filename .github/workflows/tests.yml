name: tests

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The default product: MoToBuddy across every leaf type. This is the job
  # worth making a required status check.
  test:
    name: MoToBuddy (default product)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # gmp is the only library not already on the runner image; cmake and g++
      # (needed to build MoToBuddy) and python3 (used by the test scripts) are
      # preinstalled, but naming them here keeps the job honest if that changes.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Show toolchain
        run: |
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          python3 --version

      # Clones VeriFIT/MoToBuddy at the commit pinned in the Makefile
      # (MOTOBUDDY_COMMIT) and builds libbuddy.a. Takes well under a minute, so
      # the build is not cached - a stale cache would be worse than rebuilding.
      - name: Build MoToBuddy
        run: make init

      - name: Run test suite
        run: make test

      # The unit suite against every float leaf representation, not just the
      # default f128. The terminal-dedup assertions already detected the long
      # double padding bug, but nothing built them for f80, so it only ever
      # showed up as an intermittent test-grover-f80 failure. See issues #6
      # and #7.
      - name: Run the unit suite across leaf types
        run: make test-unit-leaf-types

      # Grover amplification across f32/f64/f80/f128/gmp, each in classic,
      # --symbolic and non-loop form. This is the only CI coverage of the
      # symbolic gate path (src/gates_symb.c), and it costs ~11s.
      - name: Run Grover matrix (all leaf types, incl. symbolic)
        run: make test-grover

  # Sylvan is the optional comparison backend, not the shipped product, so it
  # gets its own job: a Sylvan-side regression should be visible without
  # reddening the check that guards MoToBuddy.
  test-sylvan:
    name: Sylvan (optional backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Build MoToBuddy
        run: make init

      # Shallow-clones Sylvan v1.8.1 and Lace v1.4.1 and builds them (~7s).
      - name: Build Sylvan and Lace
        run: make init-sylvan

      # Replays the circuit and benchmark smokes on Sylvan, then harder
      # Grover/CCX cases and cross-backend amplitude checks against MoToBuddy.
      - name: Run Sylvan test suite
        run: make test-sylvan

  # gates.c and gates_symb.c carry #ifndef __cplusplus splits: seven gates
  # (x, cnot, toffoli, mcx, and the symbolic cnot/toffoli/mcx) have a second,
  # traversal-based implementation - mtbdd_with_traverse_to / mtbdd_make_swap -
  # that is selected only when those files are compiled as C++. Nothing built
  # that configuration, so those branches were never compiled, never run, and
  # never even appeared in the coverage denominator.
  #
  # USE_CXX=1 also defines -DUSE_MOSF and builds sim_mosf.cpp, so this job
  # keeps the MOSF translation unit compiling too. Note it does not exercise
  # MOSF at runtime: sim_mosf_file reads MOSF JSON rather than OpenQASM, and
  # the repository has no such fixture.
  test-cxx:
    name: C++ gate implementations (USE_CXX=1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Build MoToBuddy
        run: make init

      # The suite asserts absolute correctness (gate identities, and symbolic
      # runs matching classic amplitude by amplitude), so passing it under both
      # USE_CXX=0 and USE_CXX=1 is what establishes that the two gate
      # implementations agree.
      - name: Run test suite against the C++ gate implementations
        run: make test USE_CXX=1

      # Mirrors the default-product job. Beyond exercising the C++ gates across
      # every leaf type, LP-Grover's loop body uses bare x and z, which no
      # symbolic fixture does - so this is what covers gate_symb_x/gate_symb_z.
      - name: Run Grover matrix against the C++ gate implementations
        run: make test-grover USE_CXX=1
