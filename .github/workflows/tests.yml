name: tests

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make test (MoToBuddy, f128)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # gmp is the only library not already on the runner image; cmake and g++
      # (needed to build MoToBuddy) and python3 (used by the test scripts) are
      # preinstalled, but naming them here keeps the job honest if that changes.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Show toolchain
        run: |
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          python3 --version

      # Clones VeriFIT/MoToBuddy at the commit pinned in the Makefile
      # (MOTOBUDDY_COMMIT) and builds libbuddy.a. Takes well under a minute, so
      # the build is not cached - a stale cache would be worse than rebuilding.
      - name: Build MoToBuddy
        run: make init

      - name: Run test suite
        run: make test
