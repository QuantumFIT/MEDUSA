name: tests

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job builds with CMake (CMakePresets.json) and runs one CTest label;
  # tests/CMakeLists.txt maps the labels onto the suites. The job names are
  # kept from the Makefile jobs these replace: the main-branch ruleset
  # requires three of them by name.
  #
  # MEDUSA_TEST_TIMEOUT_MAX keeps every CTest timeout well inside the job's
  # own limit, so a hanging test is reported by name instead of the job being
  # cut off with no output. A job that does not need the C++ gate variants
  # turns them off, which halves its build.

  # The default product: MoToBuddy across every leaf type - the unit suite on
  # each, the Grover matrix (classic, --symbolic and non-loop; the only
  # per-PR coverage of src/gates_symb.c), and the CLI, circuit, benchmark and
  # metamorphic suites. This is the job worth making a required status check.
  test:
    name: MoToBuddy (default product)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # gmp is the only library not already on the runner image; cmake and g++
      # (needed to build MoToBuddy) and python3 (used by the test scripts) are
      # preinstalled, but naming them here keeps the job honest if that changes.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Show toolchain
        run: |
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          python3 --version

      # Both builds pin MoToBuddy, each in its own file, until the Makefile is
      # gone; a bump that updates only one of them would test two different
      # libraries (see #51).
      - name: MoToBuddy pin is the same in the Makefile and CMakeLists.txt
        run: |
          make_pin=$(sed -n 's/^MOTOBUDDY_COMMIT *:= *\([0-9a-f]*\).*/\1/p' Makefile)
          cmake_pin=$(sed -n 's/^set(MEDUSA_MOTOBUDDY_COMMIT *"\([0-9a-f]*\)".*/\1/p' CMakeLists.txt)
          echo "Makefile: ${make_pin}"; echo "CMake:    ${cmake_pin}"
          if [ -z "${make_pin}" ] || [ "${make_pin}" != "${cmake_pin}" ]; then
            echo "::error::MoToBuddy pins differ between Makefile and CMakeLists.txt"
            exit 1
          fi

      # MoToBuddy is fetched at the commit pinned in CMakeLists.txt.
      - name: Configure
        run: cmake --preset release -DMEDUSA_CXX_GATES=OFF -DMEDUSA_TEST_TIMEOUT_MAX=900

      - name: Build
        run: cmake --build --preset release -j "$(nproc)"

      - name: Test (label pr)
        run: ctest --test-dir build/release -L pr -j "$(nproc)" --output-on-failure

  # Sylvan is the optional comparison backend, not the shipped product, so it
  # gets its own job: a Sylvan-side regression should be visible without
  # reddening the check that guards MoToBuddy. Replays the circuit and
  # benchmark smokes on Sylvan, the semantics suite across leaf types, the
  # Grover matrix, and cross-backend amplitude checks against MoToBuddy.
  # Sylvan has no C++ gate path.
  test-sylvan:
    name: Sylvan (optional backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      # Fetches Sylvan v1.8.1 and Lace v1.4.1 as well (cmake/patch_sylvan.cmake).
      - name: Configure
        run: cmake --preset sylvan -DMEDUSA_CXX_GATES=OFF -DMEDUSA_TEST_TIMEOUT_MAX=900

      - name: Build
        run: cmake --build --preset sylvan -j "$(nproc)"

      - name: Test (label sylvan, without the nightly sweep)
        run: ctest --preset sylvan -j "$(nproc)" --output-on-failure

  # gates.c and gates_symb.c carry #ifndef __cplusplus splits: seven gates
  # (x, cnot, toffoli, mcx, and the symbolic cnot/toffoli/mcx) have a second,
  # traversal-based implementation - mtbdd_with_traverse_to / mtbdd_make_swap -
  # that is selected only when those files are compiled as C++. The _cxx
  # variants build exactly that, and also sim_mosf.cpp, so this is the only job
  # that exercises MOSF, the JSON input path (test_mosf.sh compares each
  # tests/mosf/NAME.mosf against the OpenQASM circuit of the same name).
  #
  # The suite asserts absolute correctness (gate identities, and symbolic runs
  # matching classic amplitude by amplitude), so passing it on both gate paths
  # is what establishes that the two implementations agree. LP-Grover's loop
  # body uses bare x and z, which no symbolic fixture does - so the Grover
  # matrix is what covers gate_symb_x/gate_symb_z here.
  test-cxx:
    name: C++ gate implementations (USE_CXX=1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Configure
        run: cmake --preset release -DMEDUSA_TEST_TIMEOUT_MAX=900

      - name: Build
        run: cmake --build --preset release -j "$(nproc)"

      - name: Test (label cxx)
        run: ctest --test-dir build/release -L cxx -j "$(nproc)" --output-on-failure

  # Memory hygiene: GC and terminal-table stress for the f128 and GMP leaf
  # backends, and valgrind --leak-check=full over the unit, stress,
  # symbolic-Grover, benchmark-semantics, metamorphic and parser-error runs.
  # Reachable blocks are treated as errors, not just definitely-lost ones.
  #
  # Kept in the per-PR workflow rather than the nightly precisely because it is
  # cheap: a leak is much easier to place against the commit that introduced it
  # than against a nightly that nobody is notified about.
  memory:
    name: Stress and leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # valgrind is the one dependency here that the runner image lacks.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3 valgrind

      - name: Show toolchain
        run: |
          gcc --version | head -1
          valgrind --version

      - name: Configure
        run: cmake --preset release -DMEDUSA_CXX_GATES=OFF -DMEDUSA_TEST_TIMEOUT_MAX=900

      - name: Build
        run: cmake --build --preset release -j "$(nproc)"

      - name: Test (label memory)
        run: ctest --test-dir build/release -L memory -j "$(nproc)" --output-on-failure

  # The debug build type (-O0 -g, no LTO). Nothing else in CI compiles at -O0
  # except the coverage job; this keeps the build gdb and valgrind sessions use
  # building and passing the unit and circuit suites.
  test-debug-build:
    name: Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgmp-dev cmake g++ python3

      - name: Configure
        run: cmake --preset debug -DMEDUSA_CXX_GATES=OFF -DMEDUSA_TEST_TIMEOUT_MAX=900

      - name: Build
        run: cmake --build --preset debug -j "$(nproc)"

      - name: Unit and circuit suites on the debug build
        run: >-
          ctest --test-dir build/debug -j "$(nproc)" --output-on-failure
          -R '^(unit_api_f128|unit_htab|unit_leaf_gmp|circuits)$'
